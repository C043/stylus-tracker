# Self-host with one command:  docker compose up -d
services:
  stylus-tracker:
    build: .
    image: stylus-tracker:latest
    container_name: stylus-tracker
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: /data/stylus-tracker.db
      # Public URL the app is reached at (needed for form actions behind a proxy).
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      - stylus-data:/data

volumes:
  stylus-data:
