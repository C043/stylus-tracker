# Self-host with one command:  docker compose up -d
services:
  stylus-tracker:
    build: .
    image: stylus-tracker:latest
    container_name: stylus-tracker
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: /data/stylus-tracker.db
      # Optional: pin the public URL. Leave unset to accept any address (localhost, LAN IP,
      # or a reverse proxy that sends X-Forwarded-Proto). See server.js.
      ORIGIN: ${ORIGIN:-}
    volumes:
      - stylus-data:/data

volumes:
  stylus-data:
